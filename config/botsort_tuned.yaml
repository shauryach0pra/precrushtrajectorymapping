# Tuned BoT-SORT for the pre-crush pipeline.
# Fixes the ID-churn seen with the defaults (IDs into the 900s on a 250-frame
# clip that never holds more than ~35 people).
#
# Diagnosis: stage2 was run with --conf 0.15. Detections in the 0.15-0.25 band
# flicker on and off, so BoT-SORT kept spawning new tracks and killing them a
# few frames later. Each occlusion behind another person then re-emerged as a
# brand new ID. Raising the thresholds and holding lost tracks longer fixes it.

tracker_type: botsort

# --- the main fix: hold lost tracks through occlusion --------------------
# 30 frames = 1.2s at 25fps, too short for someone walking behind a group.
# 75 frames = 3.0s, so a person occluded for up to 3s keeps their ID.
track_buffer: 75

# --- stop spawning tracks from noise -------------------------------------
# new_track_thresh well above the old --conf 0.15 means a weak blob no longer
# earns its own ID; it can still MATCH an existing track via track_low_thresh.
new_track_thresh: 0.45
track_high_thresh: 0.35
track_low_thresh: 0.15

# --- association ----------------------------------------------------------
# Slightly looser matching so a person whose box wobbles still associates
# rather than being declared new.
match_thresh: 0.85
fuse_score: True

# Static CCTV, so global motion compensation is wasted compute and can
# misfire on a crowd that fills the frame.
gmc_method: none

# --- appearance ReID ------------------------------------------------------
# The real cure for occlusion re-identification. Costs speed; turn on only
# if your GPU can take it. Test with_reid: False first.
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto