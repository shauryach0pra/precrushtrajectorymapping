    <title>Sentinel Grid · Operations Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
    /* ============================================================
       SENTINEL GRID
       Palette : navy chrome on bone paper; oxblood / ochre / bottle
                 green as the only signal colours; brass as accent.
       Type    : Newsreader (display, editorial authority)
                 Public Sans (interface)
                 IBM Plex Mono (every number and reference)
       ============================================================ */
    :root {
        --navy: #132430;
        /* rail, headers */
        --ink: #111C25;
        --ink-2: #3A4A55;
        --ink-3: #66757F;
        --ink-4: #93A0A8;
        --paper: #ECEEEC;
        /* page — cool bone, ledger stock */
        --panel: #FFFFFF;
        --panel-2: #F5F6F4;
        --rule: #D3D7D4;
        --rule-2: #E4E7E4;
        --brass: #9A7325;
        --brass-lift: #C9A44B;
        --alarm: #9E2B25;
        --watch: #B4801B;
        --verify: #1C5A54;
        --alarm-bg: #F7E9E7;
        --watch-bg: #F8EFDC;
        --verify-bg: #E7EFEC;
        --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
        --sans: 'Public Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        --rail: 262px;
        --r: 3px;
        --r-s: 2px;
        --lift: 0 1px 0 rgba(17, 28, 37, .04);
        --lift-md: 0 10px 30px -18px rgba(17, 28, 37, .45);
        --lift-lg: 0 30px 70px -30px rgba(17, 28, 37, .55);
        --ease: cubic-bezier(.4, 0, .2, 1);
    }

    * {
        box-sizing: border-box
    }

    html, body {
        height: 100%
    }

    body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 400 13.5px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
    }

    button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        text-align: left
    }

    :focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 2px
    }

    ::selection {
        background: #E6D8B4;
        color: var(--ink)
    }

    *::-webkit-scrollbar {
        width: 10px;
        height: 10px
    }

    *::-webkit-scrollbar-track {
        background: transparent
    }

    *::-webkit-scrollbar-thumb {
        background: transparent;
        border: 3px solid transparent;
        background-clip: padding-box;
        border-radius: 8px
    }

    *:hover::-webkit-scrollbar-thumb {
        background: #C2C9C4;
        background-clip: padding-box
    }/* ---------- type utilities ---------- */

    .eyebrow {
        font: 500 9.5px/1 var(--mono);
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--ink-3)
    }

    .mono {
        font-family: var(--mono)
    }

    .mut {
        color: var(--ink-3)
    }

    .ico {
        display: block;
        flex: 0 0 auto
    }

    .ico svg {
        width: 100%;
        height: 100%;
        display: block
    }/* ---------- status tags (rectangular, not pills) ---------- */

    .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3.5px 7px;
        font: 500 9.5px/1.25 var(--mono);
        letter-spacing: .13em;
        text-transform: uppercase;
        border: 1px solid var(--rule);
        color: var(--ink-3);
        background: var(--panel-2);
        border-radius: var(--r-s);
        white-space: nowrap;
    }

    .chip i {
        width: 5px;
        height: 5px;
        background: currentColor;
        display: block
    }

    .chip.coral {
        background: var(--alarm-bg);
        color: var(--alarm);
        border-color: rgba(158, 43, 37, .28)
    }

    .chip.amber {
        background: var(--watch-bg);
        color: #8C6110;
        border-color: rgba(180, 128, 27, .32)
    }

    .chip.aqua {
        background: var(--verify-bg);
        color: var(--verify);
        border-color: rgba(28, 90, 84, .26)
    }/* ============================================================
       SHELL
       ============================================================ */

    .app {
        display: flex;
        min-height: 100vh
    }

    .rail {
        position: sticky;
        top: 0;
        height: 100vh;
        width: var(--rail);
        flex: 0 0 var(--rail);
        background: var(--navy);
        display: flex;
        flex-direction: column;
        --r-ink: #EDF1F0;
        --r-txt: #AFBDC3;
        --r-dim: #7D8E97;
        --r-line: #253845;
    }

    .brand {
        display: flex;
        gap: 11px;
        align-items: center;
        width: 100%;
        padding: 19px 18px;
        border-bottom: 1px solid var(--r-line);
        color: var(--r-ink)
    }

    .mark {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        border: 1px solid rgba(201, 164, 75, .55);
        display: grid;
        place-items: center;
        color: var(--brass-lift);
        border-radius: 1px;
    }

    .mark svg {
        width: 17px;
        height: 17px
    }

    .brand b {
        display: block;
        font: 500 15px/1.15 var(--serif);
        letter-spacing: .005em;
        color: var(--r-ink)
    }

    .brand .sub {
        display: block;
        font: 500 8.5px/1.3 var(--mono);
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--r-dim);
        margin-top: 3px
    }

    .finder {
        padding: 13px 13px 4px
    }

    .finder button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--r-line);
        color: var(--r-dim);
        font-size: 12px;
        border-radius: var(--r-s);
        transition: border-color .15s, color .15s;
    }

    .finder button:hover {
        border-color: #3B5262;
        color: var(--r-txt)
    }

    .finder kbd {
        margin-left: auto;
        font: 500 9px/1 var(--mono);
        letter-spacing: .06em;
        color: var(--r-dim)
    }

    #rolebox {
        margin: 12px 13px 2px;
        padding: 11px 11px 12px;
        border: 1px solid var(--r-line);
        border-radius: var(--r-s)
    }

    .rolebox-lbl {
        display: block;
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--r-dim);
        margin-bottom: 9px
    }

    .rolesel {
        position: relative;
        display: block
    }

    .rolesel select {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        padding: 8px 30px 8px 10px;
        border: 1px solid var(--r-line);
        border-radius: var(--r-s);
        background: rgba(255, 255, 255, .04);
        color: var(--r-ink);
        font: 500 12px/1.2 var(--sans);
        cursor: pointer;
        transition: border-color .15s var(--ease);
    }

    .rolesel select:hover {
        border-color: #41596B
    }

    .rolesel select:focus-visible {
        outline: 2px solid var(--brass-lift);
        outline-offset: 1px
    }

    .rolesel select option {
        background: #1B2C39;
        color: #EDF1F0
    }

    .rolesel svg {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        color: var(--r-dim)
    }

    .nav {
        flex: 1;
        overflow-y: auto;
        padding: 6px 12px 12px
    }

    .nav-label {
        padding: 18px 4px 8px;
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--r-dim);
        border-bottom: 1px solid var(--r-line);
        margin-bottom: 5px
    }

    .navbtn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 9px 8px 10px;
        border-radius: var(--r-s);
        color: var(--r-txt);
        font-size: 13px;
        font-weight: 400;
        position: relative;
        transition: background .16s var(--ease), color .16s var(--ease);
    }

    .navbtn::before {
        content: "";
        position: absolute;
        left: 0;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: transparent
    }

    .navbtn:hover {
        background: rgba(255, 255, 255, .05);
        color: var(--r-ink)
    }

    .navbtn.active {
        color: var(--r-ink);
        font-weight: 600;
        background: rgba(255, 255, 255, .06)
    }

    .navbtn.open.active {
        background: transparent
    }

    .navbtn.active::before {
        background: var(--brass-lift)
    }

    .navbtn .ico {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        opacity: .75
    }

    .navbtn.active .ico {
        opacity: 1;
        color: var(--brass-lift)
    }

    .navbtn .cnt {
        margin-left: auto;
        font: 500 9.5px/1 var(--mono);
        color: #E8B7B2
    }

    .navbtn .cnt.calm {
        color: var(--r-dim)
    }

    .navbtn .chev {
        margin-left: auto;
        transition: transform .2s;
        opacity: .45
    }

    .navbtn.open .chev {
        transform: rotate(90deg)
    }

    .navbtn .cnt + .chev {
        margin-left: 8px
    }

    .subnav {
        display: none;
        margin: 1px 0 6px 20px;
        padding-left: 12px;
        border-left: 1px solid var(--r-line)
    }

    .subnav.open {
        display: block
    }

    .subbtn {
        position: relative;
        display: block;
        width: 100%;
        padding: 6px 8px;
        border-radius: 1px;
        color: var(--r-dim);
        font-size: 12px;
        line-height: 1.4;
        transition: .15s
    }

    .subbtn::before {
        content: "";
        position: absolute;
        left: -13px;
        top: 4px;
        bottom: 4px;
        width: 2px;
        background: transparent
    }

    .subbtn:hover {
        color: var(--r-txt);
        background: rgba(255, 255, 255, .04)
    }

    .subbtn.active {
        color: var(--r-ink);
        background: rgba(255, 255, 255, .06);
        font-weight: 600
    }

    .subbtn.active::before {
        background: var(--brass-lift)
    }

    .rail-foot {
        border-top: 1px solid var(--r-line);
        padding: 12px 13px 14px
    }

    .health {
        display: block;
        width: 100%;
        padding: 10px 11px;
        border: 1px solid var(--r-line);
        border-radius: var(--r-s);
        margin-bottom: 10px
    }

    .health b {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 500 11px/1 var(--sans);
        color: #8FC0B8
    }

    .health small {
        display: block;
        margin-top: 6px;
        font: 400 9.5px/1.5 var(--mono);
        color: var(--r-dim)
    }

    .operator {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 7px 4px;
        border-radius: var(--r-s);
        transition: background .15s
    }

    .operator:hover {
        background: rgba(255, 255, 255, .04)
    }

    .avatar {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        display: grid;
        place-items: center;
        border-radius: 1px;
        background: #1E3542;
        border: 1px solid #2E4756;
        color: var(--brass-lift);
        font: 500 11px/1 var(--mono);
        letter-spacing: .06em
    }

    .operator .who b {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--r-ink)
    }

    .operator .who small {
        display: block;
        font: 400 9.5px/1.3 var(--mono);
        color: var(--r-dim);
        margin-top: 2px
    }/* ---------- topbar ---------- */

    .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column
    }

    .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        height: 58px;
        flex: 0 0 58px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
        background: rgba(236, 238, 236, .9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--rule);
    }

    .where {
        flex: 1 1 auto;
        min-width: 0
    }

    .where b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
    }

    .where span {
        display: block;
        font: 400 9.5px/1.4 var(--mono);
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
    }

    .top-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0
    }

    .readpair {
        padding: 0 15px;
        border-left: 1px solid var(--rule);
        white-space: nowrap
    }

    .readpair label {
        display: block;
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--ink-4)
    }

    .readpair b {
        display: block;
        margin-top: 5px;
        font: 500 12px/1 var(--mono);
        color: var(--ink-2)
    }

    .readpair b .dot-live {
        margin-right: 6px
    }

    .topbtns {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 15px;
        border-left: 1px solid var(--rule)
    }

    .icobtn {
        width: 32px;
        height: 32px;
        border-radius: var(--r-s);
        display: grid;
        place-items: center;
        border: 1px solid var(--rule);
        color: var(--ink-2);
        background: var(--panel);
        transition: .15s var(--ease);
        position: relative
    }

    .icobtn:hover {
        border-color: var(--ink-4);
        color: var(--ink)
    }

    .icobtn .dot {
        position: absolute;
        top: -3px;
        right: -3px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--alarm);
        border: 2px solid var(--paper)
    }

    .dot-live {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--verify);
        vertical-align: middle
    }/* ---------- page ---------- */

    .view {
        flex: 1;
        min-width: 0
    }

    .page {
        max-width: 1400px;
        margin: 0 auto;
        padding: 28px 28px 90px
    }

    .crumb {
        font: 500 9.5px/1 var(--mono);
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--ink-4);
        margin-bottom: 14px
    }

    .crumb b {
        color: var(--brass);
        font-weight: 500
    }

    .head {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        flex-wrap: wrap;
        margin: 0 0 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--rule)
    }

    .head .grow {
        flex: 1;
        min-width: 280px
    }

    .head .headacts {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px
    }

    .plate {
        flex: 0 0 350px;
        height: 158px;
        margin: 0;
        border: 1px solid var(--rule);
        border-radius: var(--r);
        overflow: hidden;
        background: var(--panel-2)
    }

    .plate svg {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--panel-2)
    }

    .plate {
        display: flex;
        align-items: center
    }

    .plate figcaption {
        padding: 9px 11px;
        border-top: 1px solid var(--rule-2);
        font: 500 8.5px/1.45 var(--mono);
        letter-spacing: .13em;
        text-transform: uppercase;
        color: var(--ink-3)
    }

    @media (max-width: 900px) {
        .plate {
            flex: 1 1 100%
        }
    }

    .head .chip {
        height: 34px;
        padding: 0 12px
    }

    .headbtns {
        align-self: flex-end;
        display: flex;
        gap: 8px;
        flex-wrap: wrap
    }

    .head .btn {
        height: 34px;
        padding: 0 14px;
        margin: 0;
        width: auto
    }

    h1.title {
        font: 400 36px/1.12 var(--serif);
        letter-spacing: -.012em;
        margin: 0
    }

    .desc {
        color: var(--ink-2);
        margin: 10px 0 0;
        max-width: 66ch;
        font-size: 13.5px;
        line-height: 1.7
    }/* ---------- panels ---------- */

    .panel {
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: var(--r);
        box-shadow: var(--lift)
    }

    .panel-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--rule-2)
    }

    .panel-head h2 {
        font: 600 12px/1 var(--sans);
        letter-spacing: .05em;
        text-transform: uppercase;
        margin: 0
    }

    .panel-head p {
        margin: 6px 0 0;
        font-size: 11.5px;
        color: var(--ink-3);
        text-transform: none;
        letter-spacing: 0
    }

    .panel-head .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px
    }

    .grid {
        display: grid;
        gap: 14px
    }/* ============================================================
       SIGNATURE 1 — the dispatch slip
       ============================================================ */

    .clearcard {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 34px 28px;
        gap: 4px
    }

    .clear-mark {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--verify-bg);
        color: var(--verify);
        margin-bottom: 12px
    }

    .clearcard h2 {
        font: 400 24px/1.2 var(--serif);
        margin: 0
    }

    .clearcard p {
        font-size: 13px;
        color: var(--ink-3);
        max-width: 44ch;
        margin: 10px 0 16px;
        line-height: 1.65
    }

    .slip {
        position: relative;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--ink-4);
        border-radius: var(--r);
        overflow: hidden
    }

    .slip-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 16px;
        background: var(--navy);
        color: #C8D4D8
    }

    .slip-head b {
        font: 500 9.5px/1 var(--mono);
        letter-spacing: .2em;
        text-transform: uppercase;
        color: #EDF1F0
    }

    .slip-head span {
        margin-left: auto;
        font: 400 10px/1 var(--mono);
        letter-spacing: .1em;
        color: #8FA3AC
    }

    .slip-band {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--rule);
        font: 500 10px/1 var(--mono);
        letter-spacing: .16em;
        text-transform: uppercase
    }

    .slip-band i {
        width: 7px;
        height: 7px;
        background: currentColor;
        display: block
    }

    .slip-band.alarm {
        background: var(--alarm-bg);
        color: var(--alarm)
    }

    .slip-band.watch {
        background: var(--watch-bg);
        color: #8C6110
    }

    .slip-band.quiet {
        background: var(--panel-2);
        color: var(--ink-2)
    }

    .slip-body {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        padding: 24px 20px 6px
    }

    .slip-line {
        font: 400 23px/1.45 var(--serif);
        letter-spacing: -.008em;
        margin: 0;
        max-width: 52ch
    }

    .slip-fields {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 22px 0 0;
        border-top: 1px solid var(--rule-2)
    }

    .slip-lead {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        min-height: 56px
    }

    .slip-fields > div {
        padding: 14px 0;
        border-bottom: 1px solid var(--rule-2);
        padding-right: 14px
    }

    .slip-fields > div:nth-child(3n + 2), .slip-fields > div:nth-child(3n) {
        border-left: 1px solid var(--rule-2);
        padding-left: 14px
    }

    .slip-fields dt {
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--ink-4)
    }

    .slip-fields dd {
        margin: 7px 0 0;
        font: 500 12px/1.35 var(--mono);
        color: var(--ink)
    }

    .slip-foot {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        padding: 13px 20px;
        border-top: 1px dashed var(--rule);
        background: var(--panel-2);
        font: 400 10.5px/1.5 var(--mono);
        color: var(--ink-3);
    }

    .slip-foot b {
        color: var(--ink-2);
        font-weight: 500
    }

    .slip.ack::after {
        content: "ACKNOWLEDGED";
        position: absolute;
        right: 18px;
        bottom: 52px;
        font: 600 13px/1 var(--mono);
        letter-spacing: .18em;
        color: var(--verify);
        border: 2px solid var(--verify);
        padding: 8px 12px;
        transform: rotate(-7deg);
        opacity: .42;
        pointer-events: none;
    }/* ---------- decision column ---------- */

    .decide {
        padding: 15px 18px 16px
    }

    .decide h2 {
        font: 600 12px/1 var(--sans);
        letter-spacing: .05em;
        text-transform: uppercase;
        margin: 0 0 6px
    }

    .decide p {
        font-size: 11.5px;
        color: var(--ink-3);
        margin: 0 0 12px;
        line-height: 1.6
    }

    .btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 16px;
        border-radius: var(--r-s);
        font-size: 12.5px;
        font-weight: 600;
        margin-top: 8px;
        background: var(--navy);
        color: #F1F4F3;
        border: 1px solid var(--navy);
        transition: .16s var(--ease);
    }

    .btn:hover {
        background: #1C3341;
        border-color: #1C3341
    }

    .btn:active {
        transform: translateY(1px)
    }

    .btn.ghost {
        background: var(--panel);
        border: 1px solid var(--rule);
        color: var(--ink-2);
        font-weight: 500
    }

    .btn.ghost:hover {
        border-color: var(--ink-4);
        color: var(--ink);
        background: var(--panel-2)
    }

    .btn.done {
        background: var(--verify-bg);
        border-color: rgba(28, 90, 84, .3);
        color: var(--verify);
        cursor: default
    }

    .verdict {
        display: flex;
        gap: 8px
    }

    .verdict .btn {
        flex: 1 1 0;
        margin-top: 0;
        padding: 11px 8px;
        font-size: 12px
    }

    .btn.yes {
        background: var(--verify-bg);
        border-color: rgba(28, 90, 84, .4);
        color: var(--verify)
    }

    .btn.yes:hover {
        background: var(--verify);
        border-color: var(--verify);
        color: #F1F6F4
    }

    .btn.yes.on {
        background: var(--verify);
        border-color: var(--verify);
        color: #F1F6F4;
        cursor: default;
        font-size: 11.5px;
        white-space: nowrap
    }

    .btn.no {
        background: var(--alarm-bg);
        border-color: rgba(158, 43, 37, .38);
        color: var(--alarm)
    }

    .btn.no:hover {
        background: var(--alarm);
        border-color: var(--alarm);
        color: #FBF1F0
    }

    .btnrow {
        display: flex;
        gap: 6px;
        margin-top: 8px
    }

    .btnrow .btn {
        margin-top: 0;
        flex: 1;
        padding: 9px 4px;
        font-size: 11.5px
    }/* ---------- ruled readout strip ---------- */

    .readout {
        display: flex;
        flex-wrap: wrap;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: var(--r);
        box-shadow: var(--lift)
    }

    .readout .cell {
        flex: 1 1 190px;
        min-width: 170px;
        padding: 15px 18px;
        border-left: 1px solid var(--rule-2)
    }

    .readout .cell:first-child {
        border-left: 0
    }

    .readout label {
        display: block;
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .17em;
        text-transform: uppercase;
        color: var(--ink-4)
    }

    .readout b {
        display: block;
        margin-top: 10px;
        font: 500 22px/1 var(--mono);
        letter-spacing: -.02em
    }

    .readout b.text {
        font: 400 17px/1.2 var(--serif);
        letter-spacing: 0
    }

    .readout small {
        display: block;
        margin-top: 7px;
        font-size: 11px;
        color: var(--ink-3)
    }

    .readout .trend {
        float: right;
        font: 500 10px/1 var(--mono);
        color: var(--verify)
    }

    .readout .cell.alarm b {
        color: var(--alarm)
    }

    .spark {
        margin-top: 11px;
        display: block;
        width: 100%;
        height: 20px;
        overflow: visible
    }/* ---------- signal ribbon ---------- */

    .ribbon {
        padding: 15px 18px 13px
    }

    .ribbon-top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap
    }

    .ribbon-top h2 {
        font: 600 12px/1 var(--sans);
        letter-spacing: .05em;
        text-transform: uppercase;
        margin: 0
    }

    .ribbon-legend {
        margin-left: auto;
        display: flex;
        gap: 15px;
        font: 400 9.5px/1 var(--mono);
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--ink-3)
    }

    .ribbon-legend span {
        display: flex;
        align-items: center;
        gap: 5px
    }

    .ribbon-legend i {
        width: 6px;
        height: 6px;
        display: block
    }

    .bars {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 78px;
        border-bottom: 1px solid var(--ink-4)
    }

    .bars .bar {
        flex: 1 1 0;
        min-width: 0;
        background: #B7C2C6;
        position: relative;
        transform-origin: bottom;
        animation: rise .45s var(--ease) backwards
    }

    @keyframes rise {
        from {
            transform: scaleY(.04);
            opacity: 0
        }
    }

    .bars .bar:hover {
        filter: brightness(.88)
    }

    .bars .bar.s1 {
        background: #8E9EA6
    }

    .bars .bar.s2 {
        background: var(--watch)
    }

    .bars .bar.s3 {
        background: var(--alarm)
    }

    .bars .now {
        position: absolute;
        right: -1px;
        top: -8px;
        bottom: -1px;
        width: 1px;
        background: var(--verify)
    }

    .bars .now::after {
        content: "";
        position: absolute;
        top: -3px;
        left: -2.5px;
        width: 6px;
        height: 6px;
        background: var(--verify)
    }

    .axis {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font: 400 9px/1 var(--mono);
        letter-spacing: .14em;
        color: var(--ink-4)
    }

    .tip {
        position: absolute;
        z-index: 60;
        pointer-events: none;
        transform: translate(-50%, -100%);
        background: var(--navy);
        border-radius: var(--r-s);
        padding: 6px 9px;
        font: 400 10px/1.5 var(--mono);
        color: #E4EAE9;
        white-space: nowrap;
        opacity: 0;
        transition: opacity .12s;
        box-shadow: var(--lift-md)
    }

    .tip.on {
        opacity: 1
    }/* ---------- queue rows ---------- */

    .qrow {
        display: flex;
        gap: 13px;
        align-items: flex-start;
        padding: 13px 18px;
        border-bottom: 1px solid var(--rule-2);
        width: 100%;
        transition: background .13s
    }

    .qrow:last-child {
        border-bottom: 0
    }

    .qrow:hover {
        background: var(--panel-2)
    }

    .sev {
        width: 3px;
        align-self: stretch;
        flex: 0 0 3px;
        background: var(--rule)
    }

    .sev.critical {
        background: var(--alarm)
    }

    .sev.high {
        background: var(--watch)
    }

    .sev.medium {
        background: var(--ink-4)
    }

    .qrow .body {
        flex: 1;
        min-width: 0
    }

    .qrow strong {
        display: block;
        font-size: 13px;
        font-weight: 600
    }

    .qrow .loc {
        display: block;
        margin-top: 4px;
        font: 400 10.5px/1.5 var(--mono);
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
    }

    .qrow .foot {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 9px;
        flex-wrap: wrap
    }

    .conf {
        display: flex;
        align-items: center;
        gap: 7px;
        font: 400 10px/1 var(--mono);
        color: var(--ink-3)
    }

    .conf .track {
        width: 44px;
        height: 3px;
        background: var(--rule);
        overflow: hidden
    }

    .conf .track i {
        display: block;
        height: 100%;
        background: var(--verify)
    }

    .qrow .age {
        margin-left: auto;
        font: 400 10px/1 var(--mono);
        color: var(--ink-4)
    }/* ---------- widgets ---------- */

    .widget-gauge {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 14px 14px 14px
    }

    .widget-gauge svg {
        width: 100%;
        max-width: 138px;
        height: auto
    }

    .widget-cap {
        text-align: center;
        margin-top: 2px
    }

    .widget-cap b {
        display: block;
        font-size: 12px;
        font-weight: 600
    }

    .widget-cap span {
        display: block;
        font-size: 11px;
        color: var(--ink-3);
        margin-top: 4px
    }

    .widget-compare {
        padding: 15px 18px
    }

    .wc-row + .wc-row {
        margin-top: 13px
    }

    .wc-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12.5px;
        margin-bottom: 7px
    }

    .wc-top span {
        font: 500 12px/1 var(--mono);
        color: var(--ink-2)
    }

    .track2 {
        height: 5px;
        background: var(--rule-2);
        overflow: hidden
    }

    .track2 i {
        display: block;
        height: 100%;
        transition: width .7s var(--ease)
    }

    .widget-list {
        padding: 2px 0
    }

    .wl-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--rule-2)
    }

    .wl-row:last-child {
        border-bottom: 0
    }

    .wl-row b {
        font-size: 12.5px;
        font-weight: 600;
        flex: 1 1 auto;
        min-width: 0;
        line-height: 1.35
    }

    .wl-row .v {
        flex: 0 1 auto;
        font-size: 11.5px;
        color: var(--ink-3);
        min-width: 0;
        text-align: right;
        line-height: 1.35
    }

    .wl-row .chip {
        flex: 0 0 auto;
        font-size: 9px;
        padding: 3.5px 6px;
        letter-spacing: .1em
    }/* ---------- ruled fact table ---------- */

    .facts {
        display: flex;
        flex-wrap: wrap;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: var(--r);
        box-shadow: var(--lift)
    }

    .facts .f {
        flex: 1 1 180px;
        min-width: 160px;
        padding: 13px 18px;
        border-left: 1px solid var(--rule-2)
    }

    .facts .f:first-child {
        border-left: 0
    }

    .facts label {
        display: block;
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--ink-4)
    }

    .facts b {
        display: block;
        margin-top: 8px;
        font: 500 15px/1.25 var(--mono)
    }

    .facts span {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: var(--ink-3)
    }

    @media (max-width: 640px) {
        .facts .f {
            flex-basis:50%
        }

        .facts .f:nth-child(2n + 1) {
            border-left: 0
        }
    }/* ---------- collapsibles ---------- */

    details.how {
        border: 1px solid var(--rule);
        border-radius: var(--r);
        background: var(--panel);
        overflow: hidden;
        box-shadow: var(--lift)
    }

    details.how summary {
        list-style: none;
        cursor: pointer;
        padding: 13px 18px;
        font-size: 12.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px
    }

    details.how summary::-webkit-details-marker {
        display: none
    }

    details.how summary::after {
        content: "+";
        margin-left: auto;
        color: var(--ink-4);
        font-family: var(--mono);
        font-size: 14px
    }

    details.how[open] summary::after {
        content: "–"
    }

    details.how summary:hover {
        background: var(--panel-2)
    }

    details.how[open] summary {
        border-bottom: 1px solid var(--rule-2)
    }

    .pipeline {
        display: flex;
        padding: 18px;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 0
    }

    .pl-step {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        flex: 1;
        min-width: 190px
    }

    .pl-n {
        width: 22px;
        height: 22px;
        border: 1px solid var(--rule);
        display: grid;
        place-items: center;
        font: 500 10px/1 var(--mono);
        color: var(--ink-3);
        flex: 0 0 22px;
        border-radius: 1px
    }

    .pl-txt b {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        margin-bottom: 4px
    }

    .pl-txt span {
        display: block;
        font-size: 11.5px;
        color: var(--ink-3);
        line-height: 1.55
    }

    .pl-line {
        flex: 0 0 auto;
        width: 24px;
        height: 1px;
        background: var(--rule);
        margin: 11px 8px 0
    }

    @media (max-width: 900px) {
        .pl-line {
            display:none
        }

        .pl-step {
            flex-basis: 100%;
            margin-bottom: 14px
        }
    }

    details.full-console summary {
        list-style: none;
        cursor: pointer;
        text-align: center;
        padding: 12px;
        border: 1px solid var(--rule);
        border-radius: var(--r);
        color: var(--ink-2);
        font-size: 12.5px;
        font-weight: 600;
        background: var(--panel);
        transition: .15s var(--ease);
    }

    details.full-console summary::-webkit-details-marker {
        display: none
    }

    details.full-console summary:hover {
        border-color: var(--ink-4)
    }

    details.full-console[open] summary {
        margin-bottom: 16px
    }/* ---------- tabs ---------- */

    .tabs-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--rule)
    }

    .tabs {
        display: inline-flex;
        gap: 22px
    }

    .tab {
        padding: 0 0 11px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-3);
        position: relative;
        transition: color .15s
    }

    .tab:hover {
        color: var(--ink)
    }

    .tab.active {
        color: var(--ink);
        font-weight: 600
    }

    .tab.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: var(--brass)
    }

    .tab .b {
        margin-left: 6px;
        font: 500 9.5px/1 var(--mono);
        color: var(--ink-4)
    }

    .tabs-row > .chip {
        margin-bottom: 9px
    }/* ---------- incident detail ---------- */

    .twocol {
        grid-template-columns: minmax(0, 1fr) 350px;
        align-items: start
    }

    .twocol.even {
        align-items: stretch
    }

    .twocol.even > .panel {
        display: flex;
        flex-direction: column
    }

    .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 350px;
        gap: 14px;
        align-items: stretch
    }

    .hero .side {
        display: flex;
        flex-direction: column;
        gap: 14px
    }

    .hero .side .panel {
        display: flex;
        flex-direction: column
    }

    .hero .side .trigger {
        flex: 0 0 auto
    }

    .hero .side .trigger .widget-gauge, .hero .side .trigger .widget-compare, .hero .side .trigger .widget-list {
        flex: 1;
        justify-content: center
    }

    .hero .side .decide {
        flex: 1 1 auto
    }

    .decide .acts {
        margin-top: auto;
        padding-top: 10px
    }

    .incident {
        padding: 18px
    }

    .event {
        font: 400 19px/1.5 var(--serif);
        margin: 14px 0 0;
        max-width: 58ch
    }

    .meta {
        display: flex;
        flex-wrap: wrap;
        margin-top: 18px;
        border: 1px solid var(--rule-2);
        border-radius: var(--r-s)
    }

    .meta div {
        flex: 1 1 140px;
        min-width: 140px;
        padding: 12px 16px
    }

    .meta div:not(:first-child) {
        border-left: 1px solid var(--rule-2)
    }

    .meta label {
        display: block;
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--ink-4)
    }

    .meta b {
        display: block;
        margin-top: 8px;
        font: 500 12px/1.35 var(--mono)
    }

    .viewport {
        position: relative;
        aspect-ratio: 16/9;
        background: #08131A;
        border-radius: var(--r-s);
        overflow: hidden;
        border: 1px solid var(--ink-4)
    }

    .viewport svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%
    }

    .hud {
        position: absolute;
        inset: 0;
        padding: 11px 12px;
        display: flex;
        flex-direction: column;
        font: 500 9px/1.4 var(--mono);
        letter-spacing: .13em;
        color: #7E9AA4;
        pointer-events: none
    }

    .hud .r {
        display: flex;
        gap: 10px
    }

    .hud .r.b {
        margin-top: auto
    }

    .hud .rec {
        margin-left: auto;
        color: #D2837D;
        display: flex;
        align-items: center;
        gap: 5px
    }

    .hud .rec i {
        width: 5px;
        height: 5px;
        background: currentColor;
        animation: blink 1.8s steps(1, end) infinite
    }

    @keyframes blink {
        0%, 50% {
            opacity:1
        }

        51%, 100% {
            opacity: .15
        }
    }

    .frames {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 16px 18px
    }

    .frame {
        border: 1px solid var(--rule);
        border-radius: var(--r-s);
        overflow: hidden;
        background: #08131A;
        padding: 0;
        transition: .16s var(--ease)
    }

    .frame:hover {
        border-color: var(--ink-4)
    }

    .frame.on {
        border-color: var(--brass);
        box-shadow: 0 0 0 1px var(--brass)
    }

    .frame .th {
        display: block;
        aspect-ratio: 16/10
    }

    .frame .th svg {
        width: 100%;
        height: 100%;
        display: block
    }

    .frame .cap {
        display: block;
        padding: 7px 9px;
        border-top: 1px solid var(--rule);
        background: var(--panel-2)
    }

    .frame .cap b {
        display: block;
        font: 500 10px/1 var(--mono);
        color: var(--ink-2)
    }

    .frame .cap small {
        display: block;
        margin-top: 4px;
        font: 400 9px/1 var(--mono);
        color: var(--ink-4)
    }

    .custody {
        padding: 6px 18px 16px
    }

    .step {
        display: flex;
        gap: 12px;
        padding: 10px 0
    }

    .step .marker {
        flex: 0 0 10px;
        display: flex;
        flex-direction: column;
        align-items: center
    }

    .step .knob {
        width: 9px;
        height: 9px;
        border: 1px solid var(--ink-4);
        background: var(--panel);
        margin-top: 4px;
        z-index: 2
    }

    .step.done .knob {
        border-color: var(--verify);
        background: var(--verify)
    }

    .step.now .knob {
        border-color: var(--brass);
        background: var(--brass)
    }

    .step .stem {
        flex: 1;
        width: 1px;
        background: var(--rule);
        margin: 3px 0 -13px
    }

    .step:last-child .stem {
        display: none
    }

    .step .txt b {
        display: block;
        font-size: 12.5px;
        font-weight: 600
    }

    .step .txt small {
        display: block;
        margin-top: 4px;
        font: 400 10.5px/1.5 var(--mono);
        color: var(--ink-3)
    }

    .step.pending .txt b, .step.pending .txt small {
        color: var(--ink-4)
    }

    .step.pending .knob {
        border-style: dashed
    }

    .tablewrap {
        overflow-x: auto
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        min-width: 620px
    }

    th {
        text-align: left;
        padding: 0 16px 11px;
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--ink-4);
        border-bottom: 1px solid var(--rule);
        white-space: nowrap
    }

    td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule-2);
        vertical-align: top
    }

    tbody tr:last-child td {
        border-bottom: 0
    }

    tbody tr:hover td {
        background: var(--panel-2)
    }

    td.t {
        font-family: var(--mono);
        color: var(--ink-2);
        white-space: nowrap;
        font-size: 11px
    }

    td.hash {
        font-family: var(--mono);
        color: var(--ink-4);
        font-size: 10.5px
    }

        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 18px;
        border-bottom: 1px solid var(--rule-2)
    }

    .perm:last-child {
        border-bottom: 0
    }

    .perm b {
        font-size: 12.5px;
        font-weight: 600;
        flex: 0 0 150px
    }

    .perm span {
        color: var(--ink-3);
        font-size: 12px;
        flex: 1
    }

    .perm .chip {
        flex: 0 0 auto
    }/* ---------- profile ---------- */

    .profile {
        grid-template-columns: 320px minmax(0, 1fr);
        align-items: stretch
    }

    .profile > .pcard {
        display: flex;
        flex-direction: column
    }

    .profile .pcard .note.session {
        margin-top: auto
    }

    .profile > .grid {
        display: flex;
        flex-direction: column
    }

    .profile > .grid > .panel:last-child {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column
    }

    .profile > .grid > .panel:last-child .tablewrap {
        flex: 1 1 auto
    }

    .pcard {
        padding: 22px
    }

    .bigavatar {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: var(--brass-lift);
        font: 500 18px/1 var(--mono);
        border-radius: 1px
    }

    .pcard h2 {
        font: 400 24px/1.2 var(--serif);
        margin: 16px 0 4px
    }

    .pcard .role {
        color: var(--ink-3);
        font-size: 12.5px;
        margin: 0 0 14px
    }

    .note {
        margin-top: 18px;
        padding: 14px;
        border: 1px solid var(--rule);
        border-radius: var(--r-s);
        background: var(--panel-2)
    }

    .note b {
        display: block;
        font: 500 10px/1.4 var(--mono);
        color: var(--brass);
        letter-spacing: .14em
    }

    .note p {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--ink-2);
        line-height: 1.65
    }/* ---------- palette / notifications / toasts ---------- */

    .scrim {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(17, 28, 37, .5);
        display: none
    }

    .scrim.on {
        display: block
    }

    .palette {
        position: fixed;
        z-index: 100;
        top: 12vh;
        left: 50%;
        transform: translateX(-50%);
        width: min(600px, 92vw);
        background: var(--panel);
        border: 1px solid var(--ink-4);
        border-radius: var(--r);
        box-shadow: var(--lift-lg);
        display: none;
        overflow: hidden
    }

    .palette.on {
        display: block;
        animation: pop .16s var(--ease)
    }

    @keyframes pop {
        from {
            opacity: 0;
            transform: translateX(-50%) translateY(-6px)
        }
    }

    .palette input {
        width: 100%;
        padding: 17px 18px;
        background: none;
        border: 0;
        color: var(--ink);
        font: 400 15px/1 var(--sans);
        border-bottom: 1px solid var(--rule)
    }

    .palette input:focus {
        outline: none
    }

    .results {
        max-height: min(52vh, 420px);
        overflow-y: auto;
        padding: 6px
    }

    .res {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 9px 12px;
        border-radius: var(--r-s)
    }

    .res:hover {
        background: var(--panel-2)
    }

    .res.sel {
        background: var(--panel-2);
        box-shadow: inset 2px 0 0 var(--brass)
    }

    .res .m {
        font: 500 8.5px/1 var(--mono);
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--ink-4);
        flex: 0 0 92px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap
    }

    .res .t {
        font-size: 13px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap
    }

    .res .k {
        font: 400 9.5px/1 var(--mono);
        color: var(--ink-4)
    }

    .pal-foot {
        display: flex;
        gap: 16px;
        padding: 10px 18px;
        border-top: 1px solid var(--rule-2);
        font: 400 9.5px/1 var(--mono);
        letter-spacing: .08em;
        color: var(--ink-4)
    }

    .empty {
        padding: 32px 18px;
        text-align: center;
        color: var(--ink-3);
        font-size: 13px
    }

    .notif-wrap {
        position: relative
    }

    .notif-panel {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: 364px;
        max-height: min(70vh, 460px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--ink-4);
        border-radius: var(--r);
        box-shadow: var(--lift-lg);
        z-index: 70;
        display: none
    }

    .notif-panel.on {
        display: block;
        animation: pop .14s var(--ease)
    }

    .notif-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--rule);
        position: sticky;
        top: 0;
        background: var(--panel)
    }

    .notif-head h3 {
        font: 600 11px/1 var(--sans);
        letter-spacing: .09em;
        text-transform: uppercase;
        margin: 0
    }

    .notif-head .n {
        font: 500 10px/1 var(--mono);
        color: var(--ink-4)
    }

    .notif-head button {
        margin-left: auto;
        font-size: 11px;
        color: var(--verify);
        font-weight: 600
    }

    .ntf-row {
        display: flex;
        gap: 10px;
        width: 100%;
        padding: 12px 16px;
        border-bottom: 1px solid var(--rule-2);
        position: relative;
        transition: background .12s
    }

    .ntf-row:last-child {
        border-bottom: 0
    }

    .ntf-row:hover {
        background: var(--panel-2)
    }

    .ntf-row.fresh {
        animation: land .5s var(--ease)
    }

    @keyframes land {
        from {
            background: var(--watch-bg);
            transform: translateY(-6px);
            opacity: 0
        }
    }

    .ntf-body {
        flex: 1;
        min-width: 0
    }

    .ntf-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px
    }

    .ntf-top b {
        font: 500 9px/1 var(--mono);
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--ink-3)
    }

    .ntf-time {
        margin-left: auto;
        font: 400 9.5px/1 var(--mono);
        color: var(--ink-4)
    }

    .ntf-msg {
        font-size: 12.5px;
        line-height: 1.5;
        display: block
    }

    .ntf-row:not(.unread) .ntf-msg {
        color: var(--ink-3)
    }

    .ntf-unread-dot {
        position: absolute;
        left: 6px;
        top: 18px;
        width: 4px;
        height: 4px;
        background: var(--alarm)
    }

    .notif-empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--ink-3);
        font-size: 12.5px
    }

    .toasts {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 120;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end
    }

    .toast {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 15px;
        background: var(--navy);
        border-radius: var(--r);
        box-shadow: var(--lift-lg);
        font-size: 12.5px;
        color: #EDF1F0;
        max-width: 330px;
        animation: slide .22s var(--ease)
    }

    @keyframes slide {
        from {
            opacity: 0;
            transform: translateY(8px)
        }
    }

    .toast .ok {
        color: #8FC0B8;
        flex: 0 0 auto;
        margin-top: 1px
    }

    .toast b {
        font-weight: 600
    }

    .toast small {
        display: block;
        color: #93A7AF;
        font: 400 10.5px/1.5 var(--mono);
        margin-top: 3px
    }/* ---------- responsive ---------- */

    .railtoggle {
        display: none
    }

    @media (max-width: 1240px) {
        .twocol, .hero {
            grid-template-columns: 1fr
        }

        .frames {
            grid-template-columns: repeat(2, 1fr)
        }
    }

    @media (max-width: 900px) {
        .railtoggle {
            display: grid
        }

        .rail {
            position: fixed;
            z-index: 80;
            left: 0;
            top: 0;
            transform: translateX(-100%);
            transition: transform .22s var(--ease);
            box-shadow: 0 0 60px rgba(0, 0, 0, .5)
        }

        .rail.on {
            transform: none
        }

        .profile {
            grid-template-columns: 1fr
        }

        .page, .brief {
            padding-left: 16px;
            padding-right: 16px
        }

        .topbar {
            padding: 0 16px;
            gap: 10px
        }

        .readpair.hide-sm {
            display: none
        }

        .ribbon-legend {
            display: none
        }

        .where span {
            display: none
        }

        h1.title {
            font-size: 27px
        }

        .slip-fields {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .slip-fields > div:nth-child(3n + 2), .slip-fields > div:nth-child(3n) {
            border-left: 0;
            padding-left: 0
        }

        .slip-fields > div:nth-child(2n) {
            border-left: 1px solid var(--rule-2);
            padding-left: 14px
        }
    }

    @media (max-width: 620px) {
        .frames {
            grid-template-columns: 1fr 1fr
        }

        .meta div {
            flex-basis: 100%
        }

        .meta div:not(:first-child) {
            border-left: 0;
            border-top: 1px solid var(--rule-2)
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: .001ms !important
        }
    }

        document.querySelectorAll('[data-count]').forEach(el => {
            const raw = el.dataset.count;
            if (raw.includes(':'))
                return;
            const m = raw.match(/^([\d,]+(?:\.\d+)?)(.*)$/);
            if (!m)
                return;
            const target = parseFloat(m[1].replace(/,/g, '')),
                suffix = m[2],
                dec = (m[1].split('.')[1] || '').length;
            if (!isFinite(target) || target > 100000)
                return;
            let start = null;
            const fmt = n => n.toLocaleString('en-US', {
                minimumFractionDigits: dec,

            requestAnimationFrame(function step(ts) {
                if (!start)

    /* ============================================================
       PALETTE / TOASTS / CLOCK
       ============================================================ */
    function buildPal() {
        const out = [{
            m: 'Command layer',
            t: 'Operations overview',
            p: 'dashboard'
        }, {
            m: 'Identity',
            t: 'Operator profile',
            p: 'profile'
        }];
        for (const key of permittedKeys())
            modules[key].items.forEach(it => out.push({
                m: modules[key].short,
                t: it.name,
                p: key + '/' + it.slug
            }));
        return out;
    }
    let PAL = buildPal(),
        palSel = 0,
        palList = PAL;
    function openPalette() {
        PAL = buildPal();
        document.getElementById('scrim').classList.add('on');
        document.getElementById('palette').classList.add('on');
        const i = document.getElementById('palinput');
        i.value = '';
        i.focus();
        palSel = 0;
        renderPal(PAL);
    }
    function closePalette() {
        document.getElementById('scrim').classList.remove('on');
        document.getElementById('palette').classList.remove('on');
    }
    function renderPal(list) {
        palList = list;
        const el = document.getElementById('palresults');
        if (!list.length) {
            el.innerHTML = '<div class="empty">Nothing matches that. Try "crowd", "plate" or "audit".</div>';
            return
        }
        el.innerHTML = list.map((r, i) => `<button class="res ${i === palSel ? 'sel' : ''}" onclick="closePalette();go('${r.p}')">
    <span class="m">${r.m}</span><span class="t">${esc(r.t)}</span><span class="k">↵</span></button>`).join('');
        const sel = el.children[palSel];
        if (sel && sel.scrollIntoView)
            sel.scrollIntoView({
                block: 'nearest'
            });
    }
    document.getElementById('palinput').addEventListener('input', e => {
        const q = e.target.value.toLowerCase().trim();
        palSel = 0;
        renderPal(q ? PAL.filter(r => (r.t + ' ' + r.m).toLowerCase().includes(q)) : PAL);
    });
    document.addEventListener('keydown', e => {
        const open = document.getElementById('palette').classList.contains('on');
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            open ? closePalette() : openPalette();
            return
        }
        if (!open)
            return;
        if (e.key === 'Escape')
            closePalette();
        else if (e.key === 'ArrowDown') {
            e.preventDefault();
            palSel = Math.min(palSel + 1, palList.length - 1);
            renderPal(palList)
        }
        else if (e.key === 'ArrowUp') {
            e.preventDefault();
            palSel = Math.max(palSel - 1, 0);
            renderPal(palList)
        }
        else if (e.key === 'Enter' && palList[palSel]) {
            closePalette();
            go(palList[palSel].p)
        }
    });
    function toast(msg, sub) {
        const wrap = document.getElementById('toasts');
        while (wrap.children.length >= 2)
            wrap.removeChild(wrap.firstChild);
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = `<span class="ok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></span>
    <span><b>${esc(msg)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>`;
        wrap.appendChild(el);
        setTimeout(() => {
            el.style.transition = 'opacity .3s, transform .3s';
            el.style.opacity = '0';
            el.style.transform = 'translateY(6px)';
            setTimeout(() => el.remove(), 320)
        }, 3200);
    }
    function tick() {
        const d = new Date();
        const t = clockT(d);
        const c = document.getElementById('clock');
        if (c)
            c.textContent = t;
        const h = document.getElementById('hudclock');
        if (h)
            h.textContent = t;
        const rh = document.getElementById('railhealth');
        if (rh)
            rh.textContent = `418 / 421 feeds · sync ${t}`;
    }
    setInterval(tick, 1000);
    tick();
    renderRoleBox();
    renderNav();
    renderBell();
    dashboard();
    </script>
